# CHRIST University AI Student Helpdesk - configuration
# Environment overrides: LLM_PROVIDER (ollama | offline), LLM_MODEL (e.g. llama3.2:1b)

llm:
  provider: ollama              # "ollama" or "offline" (no LLM; extractive answers)
  base_url: http://localhost:11434
  model: llama3.2:3b
  temperature: 0.1
  max_tokens: 300
  timeout: 120                  # seconds per request

embeddings:
  model: sentence-transformers/all-MiniLM-L6-v2   # falls back to TF-IDF if it cannot load

rag:
  kb_dir: data/kb
  chunk_size: 700               # characters
  chunk_overlap: 100
  top_k: 3
  min_score: 0.20               # Model 3 abstains below this top similarity

llmops:
  prompt_version: v2
  trace_db: logs/traces.db
  enable_cache: true
  enable_guardrails: true
